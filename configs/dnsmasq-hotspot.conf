# dnsmasq configuration for BTCLOTO WiFi Hotspot
# This file is generated automatically

# Interface to serve DHCP on
interface=${AP_INTERFACE}

# Don't use /etc/resolv.conf
no-resolv

# Bind to the interface only
bind-interfaces

# DHCP range
dhcp-range=${HOTSPOT_DHCP_START},${HOTSPOT_DHCP_END},255.255.255.0,24h

# Gateway (this device)
dhcp-option=option:router,${HOTSPOT_GATEWAY}

# DNS servers (use public DNS)
dhcp-option=option:dns-server,8.8.8.8,1.1.1.1

# Lease file location
dhcp-leasefile=/var/lib/misc/dnsmasq-hotspot.leases

# Logging
log-dhcp
log-facility=/var/log/hotspot.log
